
name: Kemas Kini Data Emas Harian

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  update-gold:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kod repository
        uses: actions/checkout@v4

      - name: Muat turun dan semak CSV
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import io
          import pathlib
          import urllib.request
          from datetime import date, timedelta

          url = "https://goldprice.corgano.com/data/gold-price-history.csv"
          destination = pathlib.Path("data/gold-price-history.csv")

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "GoldForecastAI/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              content = response.read()

          if len(content) < 1000:
              raise ValueError("Fail CSV terlalu kecil.")

          text = content.decode("utf-8-sig")
          reader = csv.DictReader(io.StringIO(text))

          if reader.fieldnames != ["date", "close_usd_per_oz"]:
              raise ValueError("Format lajur CSV tidak sepadan.")

          rows = list(reader)

          if len(rows) < 100:
              raise ValueError("Rekod sejarah tidak mencukupi.")

          previous = None
          today = date.today()

          for row in rows:
              current = date.fromisoformat(row["date"])
              price = float(row["close_usd_per_oz"])

              if price <= 0:
                  raise ValueError("Harga emas tidak sah.")

              if previous is not None and current <= previous:
                  raise ValueError("Tarikh CSV tidak tersusun.")

              if current > today:
                  raise ValueError("CSV mengandungi tarikh masa depan.")

              previous = current

          if previous < today - timedelta(days=10):
              raise ValueError("Data sumber terlalu lama.")

          if destination.exists():
              existing_rows = list(csv.DictReader(
                  io.StringIO(
                      destination.read_text(encoding="utf-8-sig")
                  )
              ))
              if existing_rows:
                  existing_last = date.fromisoformat(
                      existing_rows[-1]["date"]
                  )
                  if previous < existing_last:
                      raise ValueError(
                          "Data baharu lebih lama daripada data sedia ada."
                      )

          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(content)

          print("CSV sah.")
          print("Jumlah rekod:", len(rows))
          print("Tarikh terakhir:", previous)
          PY

      - name: Simpan perubahan jika ada
        shell: bash
        run: |
          if git diff --quiet -- data/gold-price-history.csv; then
            echo "Tiada perubahan data."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gold-price-history.csv
          git commit -m "Kemas kini sejarah harga emas"
          git push
